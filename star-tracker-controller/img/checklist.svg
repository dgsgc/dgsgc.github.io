<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Star Tracker Controller: camera and tracker checklist</title>
<rect width="100%" height="100%" fill="#0f1216"/>
<text x="40" y="46" font-size="24" fill="#e6e9ee" font-weight="700" text-anchor="start">Before each night</text>
<text x="40" y="72" font-size="14" fill="#a9b2bf" font-weight="400" text-anchor="start">A minute of checks saves a night of trailed or missing frames.</text>
<rect x="40" y="100" width="500" height="340" rx="12" fill="#171b21" stroke="#2a3038" stroke-width="1.5"/>
<text x="60" y="136" font-size="18" fill="#5b8ff0" font-weight="700" text-anchor="start">Camera</text>
<rect x="62" y="161" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="67,172 72,178 80,166" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="178" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Mode dial on B (or M if it has no B)</text>
<rect x="62" y="205" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="67,216 72,222 80,210" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="222" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Lens switch on MF</text>
<rect x="62" y="249" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="67,260 72,266 80,254" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="266" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Auto power-off: off</text>
<rect x="62" y="293" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="67,304 72,310 80,298" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="310" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">RAW + JPEG, drive mode Single</text>
<rect x="62" y="337" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="67,348 72,354 80,342" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="354" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Dummy battery or charged spares for long nights</text>
<rect x="62" y="381" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="67,392 72,398 80,386" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="398" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">USB lead in the Pi's data port</text>
<rect x="580" y="100" width="500" height="340" rx="12" fill="#171b21" stroke="#2a3038" stroke-width="1.5"/>
<text x="600" y="136" font-size="18" fill="#e6e9ee" font-weight="700" text-anchor="start">Tracker</text>
<rect x="602" y="161" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="607,172 612,178 620,166" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="178" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Polar aligned first (Polar alignment card)</text>
<rect x="602" y="205" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="607,216 612,222 620,210" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="222" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Tracking on, at sidereal rate</text>
<rect x="602" y="249" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="607,260 612,266 620,254" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="266" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Its guide rate matches Settings › Guide rate</text>
<rect x="602" y="293" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="607,304 612,310 620,298" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="310" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">ST-4 lead plugged in</text>
<rect x="602" y="337" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="607,348 612,354 620,342" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="354" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Balanced; cables free to turn in RA and DEC</text>
<rect x="602" y="381" width="22" height="22" rx="5" fill="#0f1216" stroke="#a9b2bf" stroke-width="2"/>
<polyline points="607,392 612,398 620,386" fill="none" stroke="#5b8ff0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="638" y="398" font-size="15" fill="#e6e9ee" font-weight="400" text-anchor="start">Site latitude and longitude set</text>
</svg>
